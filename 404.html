<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Página não encontrada</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='13' fill='%235c3a2e'/%3E%3C/svg%3E" />
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:20px 16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#4f3529;background:#fff6ef}
  .card{width:100%;max-width:480px;padding:32px 24px;text-align:center;background:#fffdfb;border-radius:24px;
    box-shadow:0 12px 32px rgba(92,58,46,.10),0 2px 6px rgba(92,58,46,.06)}
  h1{margin:0 0 10px;font-size:1.45rem;line-height:1.3;color:#3f2419}
  p{margin:0 0 24px;color:#7a5242}
  a{display:flex;align-items:center;justify-content:center;min-height:58px;border-radius:999px;color:#fff;
    font-weight:600;text-decoration:none;background:#b23d69;background-image:linear-gradient(135deg,#bd4573,#9a2f59)}
  a:focus-visible{outline:3px solid #5c3a2e;outline-offset:3px}
</style>
</head>
<body>
<main class="card">
  <h1>Ops, essa página não existe</h1>
  <p>O link que você acessou não foi encontrado. Vamos voltar para o começo do quiz?</p>
  <a href="./" id="home">Voltar ao início do quiz</a>
</main>
<script>
  // Descobre o endereço inicial do quiz: no github.io fica dentro da pasta do repositório
  (() => {
    const parts = location.pathname.split("/").filter(Boolean);
    const onGithubIo = /\.github\.io$/i.test(location.hostname);
    document.getElementById("home").href = onGithubIo && parts.length ? `/${parts[0]}/` : "/";
  })();
</script>
</body>
</html>
